name: Reliability checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journal-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      # Traces contain test-only synthetic text. Never run these tests with real personal data.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journal-ui-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 3
